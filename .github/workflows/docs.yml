name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'ratchet-*/src/main/java/**'
      - 'src/main/javadoc/**'
      - 'pom.xml'
      - '.github/workflows/docs.yml'
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Skip if triggered by a failed CI run
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v6

      # --- Javadoc generation ---
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: m2-

      - name: Generate aggregate Javadoc
        run: mvn clean package -P javadoc-aggregate -DskipTests -B

      - name: Copy Javadoc into Docusaurus static assets
        run: |
          mkdir -p website/static/javadoc
          cp -r target/reports/apidocs/* website/static/javadoc/

      # --- Conformance reports (downloaded from CI artifacts, workflow_run only) ---
      - name: Download TCK store conformance reports
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v8
        with:
          name: tck-conformance-reports
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: tck-reports/store/

      - name: Download TCK API and Jakarta conformance reports
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v8
        with:
          pattern: tck-conformance-reports-*
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: tck-reports/runtime/
          merge-multiple: false

      - name: Copy store reports into Docusaurus docs
        if: github.event_name == 'workflow_run'
        run: |
          for entry in "mysql:MySQL" "postgresql:PostgreSQL" "mongodb:MongoDB"; do
            store="${entry%%:*}"
            label="${entry##*:}"
            src="tck-reports/store/ratchet-store-${store}/target/tck-conformance-report.md"
            dst="website/docs/conformance/${store}.md"
            if [ -f "$src" ]; then
              printf -- '---\nid: %s\ntitle: %s Store Conformance\nsidebar_label: %s Store\n---\n\n' \
                "$store" "$label" "$label" | cat - "$src" > "$dst"
            fi
          done

      - name: Copy API and Jakarta reports into Docusaurus docs
        if: github.event_name == 'workflow_run'
        run: |
          declare -A SERVER_LABELS=(
            [wildfly-managed]="WildFly"
            [payara-managed]="Payara"
            [openliberty-managed]="Open Liberty"
            [glassfish-managed]="GlassFish"
          )
          declare -A DB_LABELS=(
            [mysql]="MySQL"
            [postgresql]="PostgreSQL"
            [mongodb]="MongoDB"
          )
          mkdir -p website/docs/conformance/api website/docs/conformance/jakarta
          for dir in tck-reports/runtime/tck-conformance-reports-*/; do
            [ -d "$dir" ] || continue
            suffix="${dir#tck-reports/runtime/tck-conformance-reports-}"
            suffix="${suffix%/}"
            for db in mysql postgresql mongodb; do
              if [[ "$suffix" == *"-${db}" ]]; then
                server="${suffix%-${db}}"
                database="$db"
                break
              fi
            done
            server_label="${SERVER_LABELS[$server]:-$server}"
            db_label="${DB_LABELS[$database]:-$database}"
            combo="${server}-${database}"
            for tier in api jakarta; do
              src="${dir}ratchet-testsuite/target/tck-${tier}-conformance-report.md"
              dst="website/docs/conformance/${tier}/${combo}.md"
              if [ -f "$src" ]; then
                printf -- '---\nid: %s\ntitle: "%s / %s"\nsidebar_label: "%s / %s"\n---\n\n' \
                  "$combo" "$server_label" "$db_label" "$server_label" "$db_label" \
                  | cat - "$src" > "$dst"
              fi
            done
          done

      # --- Docusaurus build ---
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build Docusaurus site
        working-directory: website
        run: npm run build

      # --- Deploy ---
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
