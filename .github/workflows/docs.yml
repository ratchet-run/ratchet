name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'ratchet-*/src/main/java/**'
      - 'src/main/javadoc/**'
      - 'pom.xml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- Javadoc generation ---
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: m2-

      - name: Generate aggregate Javadoc
        run: mvn clean package -P javadoc-aggregate -DskipTests -B

      - name: Copy Javadoc into Docusaurus static assets
        run: |
          mkdir -p website/static/javadoc
          cp -r target/reports/apidocs/* website/static/javadoc/

      # --- Docusaurus build ---
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build Docusaurus site
        working-directory: website
        run: npm run build

      # --- Deploy ---
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
