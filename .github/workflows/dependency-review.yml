name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          allow-licenses: >-
            Apache-2.0,
            MIT,
            BSD-2-Clause,
            BSD-3-Clause,
            ISC,
            EPL-1.0,
            EPL-2.0,
            MPL-2.0,
            CDDL-1.0,
            CDDL-1.1,
            GPL-2.0-with-classpath-exception,
            CC0-1.0
          deny-licenses: >-
            GPL-2.0-only,
            GPL-3.0-only,
            AGPL-3.0-only,
            LGPL-2.1-only,
            LGPL-3.0-only,
            SSPL-1.0,
            BUSL-1.1
          comment-summary-in-pr: on-failure
