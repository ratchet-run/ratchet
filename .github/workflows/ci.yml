name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: m2-
      - name: Compile
        run: mvn clean compile -B
      - name: Unit tests
        run: mvn clean test -B
      - name: Upload unit test coverage
        uses: actions/upload-artifact@v7
        with:
          name: unit-coverage
          path: ratchet/target/site/jacoco/
      - name: Format check
        run: mvn spotless:check -B

  ee11-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: m2-ee11-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            m2-ee11-
            m2-
      - name: Compile + unit tests under Jakarta EE 11 profile
        run: mvn -P jakarta-ee11-verify clean test -B

  integration-test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server: [wildfly-managed, payara-managed, openliberty-managed]
        database: [mysql, postgresql, mongodb]
        java-version: ['17']
        include:
          - server: glassfish-managed
            database: mysql
            java-version: '21'
          - server: glassfish-managed
            database: postgresql
            java-version: '21'
          - server: glassfish-managed
            database: mongodb
            java-version: '21'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
      - uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: m2-
      - name: Integration tests (${{ matrix.server }} / ${{ matrix.database }})
        run: mvn verify -P ${{ matrix.server }},${{ matrix.database }} -B -pl ratchet-testsuite,ratchet-coverage -am
      - name: Upload coverage report
        if: matrix.server == 'wildfly-managed' && matrix.database == 'mysql'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: ratchet-coverage/target/site/jacoco-aggregate/
