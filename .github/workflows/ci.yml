  # Builds the VitePress site and runs the axe-core accessibility scan against
  # every page in both the light and dark themes (website/a11y/scan.mjs). Gated
  # on the web filter so it runs whenever anything under website/ changes —
  # including docs-only edits the code filter would otherwise let skip the
  # pipeline. Skipped in the merge queue (it ran on the PR). Generated Javadoc is
  # not present in this clean-checkout build and is excluded from the scan
  # anyway, so the site builds without it.
  a11y:
    needs: changes
    if: ${{ github.event_name != 'merge_group' && needs.changes.outputs.web != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install dependencies
        working-directory: website
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('website/package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-
      - name: Install Playwright Chromium
        working-directory: website
        run: npx playwright install --with-deps chromium
      - name: Build site
        working-directory: website
        run: npm run build
      - name: Accessibility scan (light + dark)
        working-directory: website
        run: npm run a11y

  # Single aggregating gate. Branch protection requires only this context (plus
  # CodeQL's "Analyze (Java)" and DCO), so the volatile set of CI jobs lives
  # here in the workflow instead of being re-enumerated in repo settings. Adding
  # or dropping an integration-test matrix cell is gated automatically: needs
  # waits on the whole matrix and reports its aggregate result.
  #
  # if: always() is required — without it a skipped upstream skips this job too,
  # and a skipped required check sits "pending" forever and hard-blocks the PR.
  # The step keys on failure/cancelled (not "all success") so a legitimately
  # skipped upstream still passes the gate.
  ci-required:
    name: CI required
    if: ${{ always() }}
    needs: [workflow-lint, changes, build, unit-tests, spotbugs, ee11-verify, integration-test, showcase-smoke, dash-license-check, license-gate, quarkus-extension-verify, quarkus-extension-native, spring-boot-topology, spring-boot-core-compat, spring-boot-postgresql-jvm, spring-boot-sql-dialects-jvm, spring-boot-mongodb-jvm, spring-boot-aot, spring-boot-native-postgresql, a11y]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs passed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "A required upstream job failed or was cancelled:"
          echo '${{ toJSON(needs) }}'
          exit 1
