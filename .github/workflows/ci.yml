name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  # Lets release.yml and snapshot.yml reuse the full matrix as their verify gate.
  workflow_call:

# Ryuk, the Testcontainers resource reaper, is unnecessary on ephemeral GitHub runners — the VM is
# thrown away after each job, so anything it would reap dies with it. Its image pull is also an
# intermittent failure point: a stalled testcontainers/ryuk pull during a fixture's static init
# aborts every test in that module. Disabling it removes the flake without losing cleanup we rely on.
env:
  TESTCONTAINERS_RYUK_DISABLED: "true"

jobs:
  # Validate workflow structure and parse every shell run block before any
  # release can reach its deploy step. Limit ShellCheck to errors so this gate
  # catches invalid shell without turning existing advisory findings into
  # unrelated CI failures. It also runs the functional tests for the release
  # helper scripts so script-logic regressions gate pull requests instead of
  # surfacing only in the post-merge documentation deploy or a release run.
  workflow-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Lint GitHub Actions workflows and embedded shell
        uses: docker://rhysd/actionlint:1.7.12
        env:
          SHELLCHECK_OPTS: -S error
        with:
          args: -color
      - name: Test runtime conformance report materialization
        run: scripts/test-materialize-runtime-conformance-reports.sh
      - name: Test release version synchronization
        run: scripts/test-sync-version.sh
      - name: Test Spring Boot publication topology guard
        run: scripts/test-test-spring-boot-publication-topology.sh
      - name: Test Spring Boot runtime dependency graph guard
        run: scripts/test-check-runtime-dependency-graph.sh
      - name: Test signed commit request generation
        run: scripts/test-gh-signed-commit.sh

  # Detects whether a pull request touches anything other than documentation, so
  # the heavy integration matrix, the EE 11 lane, and CodeQL can be skipped on
  # docs-only PRs. Only pull_request events are eligible for that docs skip;
  # pushes to main and release builds (workflow_call) always run the full
  # pipeline. The merge queue (merge_group) runs a reduced pipeline — build,
  # unit-tests, and spotbugs only — because the heavy lanes already ran on the
  # PR and run again on the post-merge push to main (see the integration-test /
  # ee11-verify guards). The leading '**' is the base set; the '!' rules subtract docs from
  # it, so code == 'true' only when a non-doc file changed. On non-PR events the
  # filter step is skipped and the output is empty, which the downstream
  # `!= 'false'` guards read as "run".
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      web: ${{ steps.filter.outputs.web }}
      spring-boot: ${{ steps.filter.outputs['spring-boot'] }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          # 'every' makes a file count as code only when it matches ALL rules
          # (not md, not adoc, not under website, not LICENSE). The default
          # 'some' quantifier lets the base '**' match every file, so the '!'
          # rules never subtract and docs-only PRs run the full matrix. The same
          # 'every' quantifier is harmless for the single-pattern web filter: a
          # changed file counts as web only when it lives under website/.
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!**/*.adoc'
              - '!website/**'
              - '!LICENSE'
            web:
              - 'website/**'
            # predicate-quantifier is global and set to 'every', so this must
            # remain one brace-union pattern rather than separate positive
            # patterns that no single changed file could match simultaneously.
            spring-boot:
              - '{integrations/ratchet-spring-boot/**,ratchet-api/**,ratchet/**,stores/**,testing/ratchet-tck/**,pom.xml,.github/workflows/**,scripts/**}'

  # Thin gate that releases the integration-test matrix: compile + format check
  # only, no tests. The unit suite lives in the unit-tests job below, which runs
  # in parallel with the matrix instead of in front of it.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: m2-
      - name: Compile
        run: mvn clean compile -B
      - name: Format check
        run: mvn spotless:check -B

  # Runs the unit suite exactly once per pipeline. Deliberately NOT gated on
  # changes or merge_group: build and spotbugs are the only other jobs that run
  # in the merge queue, and with build reduced to compile + format this job is
  # the queue's sole test signal. Gating it there would let queue merges land
  # with zero tests executed.
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: m2-
      - name: Unit tests
        run: mvn clean test -B
      - name: Upload unit test coverage
        uses: actions/upload-artifact@v7
        with:
          name: unit-coverage
          path: ratchet/target/site/jacoco/
      - name: Upload TCK conformance reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tck-conformance-reports
          path: stores/ratchet-store-*/target/tck-conformance-report.md

  spotbugs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: m2-
      # Single-pass reactor: test-compile builds every module so spotbugs:check
      # resolves siblings from the workspace, then the concurrency/correctness
      # gate runs once across all modules.
      - name: SpotBugs concurrency/correctness gate
        run: mvn -B -ntp -DskipTests clean test-compile spotbugs:check

  ee11-verify:
    needs: changes
    # Skipped in the merge queue (merge_group): the full pre-merge validation
    # already ran on the PR, and the post-merge push to main runs it again. The
    # queue only needs the fast build + unit-tests + spotbugs smoke to merge.
    if: ${{ github.event_name != 'merge_group' && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: m2-ee11-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            m2-ee11-
            m2-
      - name: Compile + unit tests under Jakarta EE 11 profile
        run: mvn -P jakarta-ee11-verify clean test -B

  integration-test:
    needs: [build, changes]
    # Skipped in the merge queue (merge_group) — see ee11-verify above. The PR
    # run and the post-merge push to main both run the full matrix, so the queue
    # stays fast without leaving main unvalidated.
    if: ${{ github.event_name != 'merge_group' && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    # The slowest healthy cell finishes well under 30 minutes; a wedged
    # container deploy otherwise burns the full 6-hour default before the
    # runner kills it.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        server: [wildfly-managed, wildfly-ee11-managed, payara-managed, openliberty-managed]
        # Oracle runs the full server matrix like the other stores; the ojdbc
        # driver stays test-scoped and the gvenzl container supplies the database.
        database: [mysql, postgresql, mongodb, oracle, sqlserver]
        include:
          - server: glassfish-managed
            database: mysql
          - server: glassfish-managed
            database: postgresql
          - server: glassfish-managed
            database: mongodb
          - server: glassfish-managed
            database: oracle
          - server: glassfish-managed
            database: sqlserver
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: m2-
      - name: Integration tests (${{ matrix.server }} / ${{ matrix.database }})
        # spotbugs.skip: the SpotBugs gate is bound to verify but runs once in the
        # dedicated spotbugs job — skip it here so it isn't re-analyzed per matrix cell.
        #
        # timeout(1) fails the step (exit 124) instead of letting a wedged
        # container deploy ride to the job-level kill, and TERMs only the
        # Maven process — the forked JVM and the app server survive as
        # orphans so the next step can thread-dump them.
        #
        # -Dtest=ZZZ_NoMatch skips surefire across the -am dependency closure:
        # the server/database profiles only affect the testsuite ITs, so
        # re-running every upstream module's unit tests (Testcontainers suites
        # included) in all 25 cells is pure redundancy — the unit-tests job
        # already runs them once. The pom ignores -Dsurefire.skip, hence the
        # no-match pattern; failsafe filters on -Dit.test, so the ITs still run.
        run: timeout --kill-after=60 45m mvn verify -P ${{ matrix.server }},${{ matrix.database }} -B -Dspotbugs.skip=true -Dtest=ZZZ_NoMatch -Dsurefire.failIfNoSpecifiedTests=false -pl :ratchet-testsuite,:ratchet-coverage -am
      - name: Thread-dump surviving JVMs
        if: failure()
        run: |
          for pid in $(jcmd -l | awk '$2 !~ /jcmd/ {print $1}'); do
            echo "::group::jcmd ${pid} Thread.print"
            jcmd "${pid}" VM.command_line || true
            jcmd "${pid}" Thread.print || true
            echo "::endgroup::"
          done
      - name: Upload coverage report
        if: matrix.server == 'wildfly-managed' && matrix.database == 'mysql'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: testing/ratchet-coverage/target/site/jacoco-aggregate/
      - name: Upload TCK conformance reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tck-conformance-reports-${{ matrix.server }}-${{ matrix.database }}
          path: testing/ratchet-testsuite/target/tck-*-conformance-report.md

  showcase-smoke:
    needs: [build, changes]
    if: ${{ github.event_name != 'merge_group' && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: m2-
      - name: Install showcase reactor dependencies
        run: >-
          mvn -B -ntp -pl :ratchet-showcase -am
          -DskipTests -Dspotbugs.skip=true install
      - name: Smoke test the WildFly and PostgreSQL showcase
        run: >-
          mvn -B -ntp -pl :ratchet-showcase
          -P wildfly-managed,postgresql
          -DskipTests -Dspotbugs.skip=true
          -Dshowcase.smoke=true
          -Dshowcase.http.port=4176
          -Dshowcase.context.path=/app
          -Dwildfly.management.port=19993
          -Dwildfly.https.port=18446
          package exec:exec@run-showcase
      - name: Upload showcase server log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: showcase-smoke-server-log
          path: testing/ratchet-showcase/target/wildfly-runs/*/standalone/log/server.log

  # Eclipse Dash vets every dependency's license against the Eclipse Foundation
  # approved-license list. It is SPDX-aware — it resolves dual licenses and the
  # GPL Classpath / MySQL FOSS exceptions correctly, which a name-matching gate
  # cannot — and is wired into ci-required below so a disallowed license blocks
  # the merge instead of only being reported. Skipped in the merge queue (it ran
  # on the PR) and on docs-only PRs (no dependency can have changed).
  dash-license-check:
    needs: changes
    if: ${{ github.event_name != 'merge_group' && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Configure Eclipse Dash plugin repository
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
          <settings>
            <profiles>
              <profile>
                <id>eclipse-dash</id>
                <pluginRepositories>
                  <pluginRepository>
                    <id>dash-licenses</id>
                    <url>https://repo.eclipse.org/content/repositories/dash-licenses/</url>
                  </pluginRepository>
                </pluginRepositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>eclipse-dash</activeProfile>
            </activeProfiles>
          </settings>
          EOF
      - name: Eclipse Dash license check
        # api.eclipse.org occasionally times out under load. Retry up to six
        # times with 60s between attempts to absorb transient failures without
        # masking real outages. The batch size is capped because the default
        # sends the whole dependency list (~344 items) as one request, which
        # dies on the foundation's 60-second gateway timeout whenever the
        # service is slow; batches of 25 finish well inside the window.
        run: |
          for attempt in 1 2 3 4 5 6; do
            mvn org.eclipse.dash:license-tool-plugin:1.1.0:license-check \
              -Ddash.summary=target/dash-DEPENDENCIES -Ddash.batch=25 && exit 0
            echo "Attempt $attempt failed; sleeping 60s before retry..."
            sleep 60
          done
          echo "Eclipse Dash license check failed after 6 attempts."
          exit 1

  # Deterministic copyleft gate, the offline companion to Eclipse Dash. Installs
  # the reactor so every module resolves, then fails if any compile/runtime
  # dependency of a shipped artifact carries GPL/LGPL/AGPL/SSPL without a linking
  # exception. Narrowly scoped and network-light, so it still gates when
  # api.eclipse.org is unavailable. Same merge-queue / docs-only skip as Dash.
  license-gate:
    needs: changes
    if: ${{ github.event_name != 'merge_group' && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: m2-
      - name: Install reactor (no tests) so every module resolves
        run: mvn -B -ntp -DskipTests -Dspotbugs.skip=true -Dmaven.javadoc.skip=true install
      - name: Copyleft dependency-license gate
        run: bash infra/ci/check-dependency-licenses.sh

  # Runs the ratchet-quarkus extension's full TCK suite once per store. The main
  # build now compiles and unit-tests these reactor modules (including the default
  # PostgreSQL profile), while this matrix preserves explicit coverage for every
  # supported SQL store and the MongoDB flavor. Each
  # cell swaps in that store's jar plus the matching quarkus-jdbc-<db> extension
  # or MongoDB flavor via the db-<kind> Maven profile (defined in the
  # integration-tests pom), and the RatchetDatabaseTestResource spins up a
  # matching Testcontainers database keyed on quarkus.datasource.db-kind. fail-fast
  # is off so one store's failure never masks another's verdict. Oracle and SQL
  # Server pull ~2GB images, which is why this stays gated on the code filter
  # rather than running on every PR.
  quarkus-extension-verify:
    needs: changes
    if: ${{ github.event_name != 'merge_group' && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    name: quarkus-extension-verify (${{ matrix.db }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: postgres
            profile: db-postgres
          - db: mysql
            profile: db-mysql
          - db: oracle
            profile: db-oracle
          - db: sqlserver
            profile: db-sqlserver
          - db: mongodb
            profile: db-mongo
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: m2-quarkus-ext-${{ matrix.db }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            m2-quarkus-ext-${{ matrix.db }}-
            m2-quarkus-ext-
            m2-
      - name: Build + test the ratchet-quarkus extension
        # SpotBugs runs once for the full reactor in the dedicated job above.
        run: >-
          mvn -B -ntp -Dspotbugs.skip=true
          -pl integrations/ratchet-quarkus/integration-tests -am
          verify -P${{ matrix.profile }}

  # Native smoke gates for MongoDB and the DEFAULT SQL (PostgreSQL/Hibernate) flavor. The SQL cell
  # exercises the Hibernate/JPA-native reflection surface (entities, UuidV7EntityListener,
  # InstantAttributeConverter, Agroal) that the Mongo native build never loads, and it is the flavor
  # most users run.
  quarkus-extension-native:
    needs: changes
    if: ${{ github.event_name != 'merge_group' && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    name: quarkus-extension-native (${{ matrix.db }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: mongodb
            cache: mongo
            profile: db-mongo,native-mongo
          - db: sql
            cache: sql
            profile: db-postgres,native-sql
    steps:
      - uses: actions/checkout@v7
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: m2-quarkus-ext-native-${{ matrix.cache }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            m2-quarkus-ext-native-${{ matrix.cache }}-
            m2-quarkus-ext-
            m2-
      - name: Native smoke test (${{ matrix.db }})
        run: >-
          mvn -B -ntp -Dspotbugs.skip=true
          -pl integrations/ratchet-quarkus/integration-tests -am
          verify -P${{ matrix.profile }}

  spring-boot-topology:
    # This job is a required status-check dependency, so it remains present on
    # every event. Pull requests outside the Spring dependency surface report
    # an explicit success instead of skipping the job.
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Skip notice (no Spring Boot topology changes)
        if: needs.changes.outputs['spring-boot'] == 'false'
        run: echo "No Spring Boot topology inputs changed — skipping verification."

      - uses: actions/checkout@v7
        if: needs.changes.outputs['spring-boot'] != 'false'

      # Two JDKs: the consumer lanes must run on the matrix's declared Java
      # 17 runtime, but the root reactor build (Spotless, etc.) requires a
      # newer javac. Install 17 first, then 25 second so setup-java leaves
      # JAVA_HOME/PATH pointed at 25 for the build; the 17 home is exported
      # by setup-java as JAVA_HOME_17_X64 for the consumer lane below.
      - uses: actions/setup-java@v5
        if: needs.changes.outputs['spring-boot'] != 'false'
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: actions/setup-java@v5
        if: needs.changes.outputs['spring-boot'] != 'false'
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: actions/cache@v6
        if: needs.changes.outputs['spring-boot'] != 'false'
        with:
          path: ~/.m2/repository
          key: m2-spring-boot-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            m2-spring-boot-
            m2-

      - name: Verify Spring Boot publication topology and compatibility
        if: needs.changes.outputs['spring-boot'] != 'false'
        env:
          RATCHET_MATRIX_JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: integrations/ratchet-spring-boot/integration-tests/verify.sh topology

  spring-boot-core-compat:
    # This job is a required status-check dependency, so it remains present on
    # every event. Pull requests outside the Spring dependency surface report
    # an explicit success instead of skipping the job.
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Skip notice (no Spring Boot core compatibility changes)
        if: needs.changes.outputs['spring-boot'] == 'false'
        run: echo "No Spring Boot core compatibility inputs changed — skipping verification."

      - uses: actions/checkout@v7
        if: needs.changes.outputs['spring-boot'] != 'false'

      # Two JDKs: verify-jvm-matrix.sh's consumer lanes must run on the
      # matrix's declared Java 17 runtime, but the root reactor build
      # (Spotless, etc.) requires a newer javac. Install 17 first, then 25
      # second so setup-java leaves JAVA_HOME/PATH pointed at 25 for the
      # build; the 17 home is exported by setup-java as JAVA_HOME_17_X64 for
      # the consumer lane below.
      - uses: actions/setup-java@v5
        if: needs.changes.outputs['spring-boot'] != 'false'
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: actions/setup-java@v5
        if: needs.changes.outputs['spring-boot'] != 'false'
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: actions/cache@v6
        if: needs.changes.outputs['spring-boot'] != 'false'
        with:
          path: ~/.m2/repository
          key: m2-spring-boot-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            m2-spring-boot-
            m2-

      - name: Verify Spring Boot core compatibility
        if: needs.changes.outputs['spring-boot'] != 'false'
        env:
          RATCHET_MATRIX_JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: integrations/ratchet-spring-boot/integration-tests/verify.sh core-compat

  spring-boot-postgresql-jvm:
    # This job is a required status-check dependency, so it remains present on
    # every event. Pull requests outside the Spring dependency surface report
    # an explicit success instead of skipping the job.
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Skip notice (no Spring Boot PostgreSQL changes)
        if: needs.changes.outputs['spring-boot'] == 'false'
        run: echo "No Spring Boot PostgreSQL inputs changed — skipping verification."

      - uses: actions/checkout@v7
        if: needs.changes.outputs['spring-boot'] != 'false'

      # Two JDKs: verify-jvm-matrix.sh's consumer lanes must run on the
      # matrix's declared Java 17 runtime, but the root reactor build
      # (Spotless, etc.) requires a newer javac. Install 17 first, then 25
      # second so setup-java leaves JAVA_HOME/PATH pointed at 25 for the
      # build; the 17 home is exported by setup-java as JAVA_HOME_17_X64 for
      # the consumer lane below.
      - uses: actions/setup-java@v5
        if: needs.changes.outputs['spring-boot'] != 'false'
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: actions/setup-java@v5
        if: needs.changes.outputs['spring-boot'] != 'false'
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: actions/cache@v6
        if: needs.changes.outputs['spring-boot'] != 'false'
        with:
          path: ~/.m2/repository
          key: m2-spring-boot-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            m2-spring-boot-
            m2-

      - name: Verify Spring Boot PostgreSQL compatibility
        if: needs.changes.outputs['spring-boot'] != 'false'
        env:
          RATCHET_MATRIX_JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: integrations/ratchet-spring-boot/integration-tests/verify.sh postgresql-runtime

      - name: Upload Spring Boot PostgreSQL conformance reports
        if: needs.changes.outputs['spring-boot'] != 'false'
        uses: actions/upload-artifact@v7
        with:
          name: spring-boot-postgresql-conformance
          path: integrations/ratchet-spring-boot/integration-tests/target/jvm-matrix-reports/conformance/postgresql
          if-no-files-found: error

  spring-boot-sql-dialects-jvm:
    # This job is a required status-check dependency, so it remains present on
    # every event. Pull requests outside the Spring dependency surface report
    # an explicit success instead of skipping the job.
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Skip notice (no Spring Boot SQL dialect changes)
        if: needs.changes.outputs['spring-boot'] == 'false'
        run: echo "No Spring Boot SQL dialect inputs changed — skipping verification."

      - uses: actions/checkout@v7
        if: needs.changes.outputs['spring-boot'] != 'false'

      # Two JDKs: verify-jvm-matrix.sh's consumer lanes must run on the
      # matrix's declared Java 17 runtime, but the root reactor build
      # (Spotless, etc.) requires a newer javac. Install 17 first, then 25
      # second so setup-java leaves JAVA_HOME/PATH pointed at 25 for the
      # build; the 17 home is exported by setup-java as JAVA_HOME_17_X64 for
      # the consumer lane below.
      - uses: actions/setup-java@v5
        if: needs.changes.outputs['spring-boot'] != 'false'
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: actions/setup-java@v5
        if: needs.changes.outputs['spring-boot'] != 'false'
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: actions/cache@v6
        if: needs.changes.outputs['spring-boot'] != 'false'
        with:
          path: ~/.m2/repository
          key: m2-spring-boot-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            m2-spring-boot-
            m2-

      - name: Verify Spring Boot MySQL dialect compatibility
        if: needs.changes.outputs['spring-boot'] != 'false'
        env:
          RATCHET_MATRIX_JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: integrations/ratchet-spring-boot/integration-tests/verify.sh dialect-mysql

      - name: Upload Spring Boot MySQL conformance reports
        if: needs.changes.outputs['spring-boot'] != 'false'
        uses: actions/upload-artifact@v7
        with:
          name: spring-boot-mysql-conformance
          path: integrations/ratchet-spring-boot/integration-tests/target/jvm-matrix-reports/conformance/mysql
          if-no-files-found: error

      - name: Verify Spring Boot Oracle dialect compatibility
        if: needs.changes.outputs['spring-boot'] != 'false'
        env:
          RATCHET_MATRIX_JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: integrations/ratchet-spring-boot/integration-tests/verify.sh dialect-oracle

      - name: Upload Spring Boot Oracle conformance reports
        if: needs.changes.outputs['spring-boot'] != 'false'
        uses: actions/upload-artifact@v7
        with:
          name: spring-boot-oracle-conformance
          path: integrations/ratchet-spring-boot/integration-tests/target/jvm-matrix-reports/conformance/oracle
          if-no-files-found: error

