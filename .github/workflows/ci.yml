name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

# Ryuk, the Testcontainers resource reaper, is unnecessary on ephemeral GitHub runners — the VM is
# thrown away after each job, so anything it would reap dies with it. Its image pull is also an
# intermittent failure point: a stalled testcontainers/ryuk pull during a fixture's static init
# aborts every test in that module. Disabling it removes the flake without losing cleanup we rely on.
env:
  TESTCONTAINERS_RYUK_DISABLED: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: m2-
      - name: Compile
        run: mvn clean compile -B
      - name: Unit tests
        run: mvn clean test -B
      - name: Upload unit test coverage
        uses: actions/upload-artifact@v7
        with:
          name: unit-coverage
          path: ratchet/target/site/jacoco/
      - name: Upload TCK conformance reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tck-conformance-reports
          path: ratchet-store-*/target/tck-conformance-report.md
      - name: Format check
        run: mvn spotless:check -B

  spotbugs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: m2-
      # Single-pass reactor: test-compile builds every module so spotbugs:check
      # resolves siblings from the workspace, then the concurrency/correctness
      # gate runs once across all modules.
      - name: SpotBugs concurrency/correctness gate
        run: mvn -B -ntp -DskipTests clean test-compile spotbugs:check

  ee11-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: m2-ee11-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            m2-ee11-
            m2-
      - name: Compile + unit tests under Jakarta EE 11 profile
        run: mvn -P jakarta-ee11-verify clean test -B

  integration-test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server: [wildfly-managed, wildfly-ee11-managed, payara-managed, openliberty-managed]
        database: [mysql, postgresql, mongodb]
        include:
          - server: glassfish-managed
            database: mysql
          - server: glassfish-managed
            database: postgresql
          - server: glassfish-managed
            database: mongodb
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: m2-
      - name: Integration tests (${{ matrix.server }} / ${{ matrix.database }})
        # spotbugs.skip: the SpotBugs gate is bound to verify but runs once in the
        # dedicated spotbugs job — skip it here so it isn't re-analyzed per matrix cell.
        run: mvn verify -P ${{ matrix.server }},${{ matrix.database }} -B -Dspotbugs.skip=true -pl ratchet-testsuite,ratchet-coverage -am
      - name: Upload coverage report
        if: matrix.server == 'wildfly-managed' && matrix.database == 'mysql'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: ratchet-coverage/target/site/jacoco-aggregate/
      - name: Upload TCK conformance reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tck-conformance-reports-${{ matrix.server }}-${{ matrix.database }}
          path: ratchet-testsuite/target/tck-*-conformance-report.md

  # Single aggregating gate. Branch protection requires only this context (plus
  # CodeQL's "Analyze (Java)" and DCO), so the volatile set of CI jobs lives
  # here in the workflow instead of being re-enumerated in repo settings. Adding
  # or dropping an integration-test matrix cell is gated automatically: needs
  # waits on the whole matrix and reports its aggregate result.
  #
  # if: always() is required — without it a skipped upstream skips this job too,
  # and a skipped required check sits "pending" forever and hard-blocks the PR.
  # The step keys on failure/cancelled (not "all success") so a legitimately
  # skipped upstream still passes the gate.
  ci-required:
    name: CI required
    if: ${{ always() }}
    needs: [build, spotbugs, ee11-verify, integration-test]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs passed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "A required upstream job failed or was cancelled:"
          echo '${{ toJSON(needs) }}'
          exit 1
