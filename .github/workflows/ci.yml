name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  # Lets release.yml and snapshot.yml reuse the full matrix as their verify gate.
  workflow_call:

# Ryuk, the Testcontainers resource reaper, is unnecessary on ephemeral GitHub runners — the VM is
# thrown away after each job, so anything it would reap dies with it. Its image pull is also an
# intermittent failure point: a stalled testcontainers/ryuk pull during a fixture's static init
# aborts every test in that module. Disabling it removes the flake without losing cleanup we rely on.
env:
  TESTCONTAINERS_RYUK_DISABLED: "true"

jobs:
  # Detects whether a pull request touches anything other than documentation, so
  # the heavy integration matrix, the EE 11 lane, and CodeQL can be skipped on
  # docs-only PRs. Only pull_request events are eligible for that docs skip;
  # pushes to main and release builds (workflow_call) always run the full
  # pipeline. The merge queue (merge_group) runs a reduced pipeline — build and
  # spotbugs only — because the heavy lanes already ran on the PR and run again
  # on the post-merge push to main (see the integration-test / ee11-verify
  # guards). The leading '**' is the base set; the '!' rules subtract docs from
  # it, so code == 'true' only when a non-doc file changed. On non-PR events the
  # filter step is skipped and the output is empty, which the downstream
  # `!= 'false'` guards read as "run".
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          # 'every' makes a file count as code only when it matches ALL rules
          # (not md, not adoc, not under website, not LICENSE). The default
          # 'some' quantifier lets the base '**' match every file, so the '!'
          # rules never subtract and docs-only PRs run the full matrix.
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!**/*.adoc'
              - '!website/**'
              - '!LICENSE'

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: m2-
      - name: Compile
        run: mvn clean compile -B
      - name: Unit tests
        run: mvn clean test -B
      - name: Upload unit test coverage
        uses: actions/upload-artifact@v7
        with:
          name: unit-coverage
          path: ratchet/target/site/jacoco/
      - name: Upload TCK conformance reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tck-conformance-reports
          path: ratchet-store-*/target/tck-conformance-report.md
      - name: Format check
        run: mvn spotless:check -B

  spotbugs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: m2-
      # Single-pass reactor: test-compile builds every module so spotbugs:check
      # resolves siblings from the workspace, then the concurrency/correctness
      # gate runs once across all modules.
      - name: SpotBugs concurrency/correctness gate
        run: mvn -B -ntp -DskipTests clean test-compile spotbugs:check

  ee11-verify:
    needs: changes
    # Skipped in the merge queue (merge_group): the full pre-merge validation
    # already ran on the PR, and the post-merge push to main runs it again. The
    # queue only needs the fast build + spotbugs smoke to merge.
    if: ${{ github.event_name != 'merge_group' && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: m2-ee11-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            m2-ee11-
            m2-
      - name: Compile + unit tests under Jakarta EE 11 profile
        run: mvn -P jakarta-ee11-verify clean test -B

  integration-test:
    needs: [build, changes]
    # Skipped in the merge queue (merge_group) — see ee11-verify above. The PR
    # run and the post-merge push to main both run the full matrix, so the queue
    # stays fast without leaving main unvalidated.
    if: ${{ github.event_name != 'merge_group' && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server: [wildfly-managed, wildfly-ee11-managed, payara-managed, openliberty-managed]
        database: [mysql, postgresql, mongodb]
        include:
          - server: glassfish-managed
            database: mysql
          - server: glassfish-managed
            database: postgresql
          - server: glassfish-managed
            database: mongodb
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: m2-
      - name: Integration tests (${{ matrix.server }} / ${{ matrix.database }})
        # spotbugs.skip: the SpotBugs gate is bound to verify but runs once in the
        # dedicated spotbugs job — skip it here so it isn't re-analyzed per matrix cell.
        run: mvn verify -P ${{ matrix.server }},${{ matrix.database }} -B -Dspotbugs.skip=true -pl ratchet-testsuite,ratchet-coverage -am
      - name: Upload coverage report
        if: matrix.server == 'wildfly-managed' && matrix.database == 'mysql'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: ratchet-coverage/target/site/jacoco-aggregate/
      - name: Upload TCK conformance reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tck-conformance-reports-${{ matrix.server }}-${{ matrix.database }}
          path: ratchet-testsuite/target/tck-*-conformance-report.md

  # Single aggregating gate. Branch protection requires only this context (plus
  # CodeQL's "Analyze (Java)" and DCO), so the volatile set of CI jobs lives
  # here in the workflow instead of being re-enumerated in repo settings. Adding
  # or dropping an integration-test matrix cell is gated automatically: needs
  # waits on the whole matrix and reports its aggregate result.
  #
  # if: always() is required — without it a skipped upstream skips this job too,
  # and a skipped required check sits "pending" forever and hard-blocks the PR.
  # The step keys on failure/cancelled (not "all success") so a legitimately
  # skipped upstream still passes the gate.
  ci-required:
    name: CI required
    if: ${{ always() }}
    needs: [changes, build, spotbugs, ee11-verify, integration-test]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs passed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "A required upstream job failed or was cancelled:"
          echo '${{ toJSON(needs) }}'
          exit 1
