name: OWASP Dependency Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  owasp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache Maven repository
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: m2-

      - name: Compile (resolves the dep graph for the plugin)
        run: mvn -B -DskipTests install

      - name: Run OWASP Dependency-Check
        # Pinned to the main HEAD SHA: upstream only tags 1.0.0/1.1.0 (2021),
        # which predate the SARIF support this workflow relies on. main is the
        # maintained line. Bump the SHA + comment when upstream advances.
        uses: dependency-check/Dependency-Check_Action@1e54355a8b4c8abaa8cc7d0b70aa655a3bb15a6c # main @ 2025-12-10
        env:
          JAVA_HOME: /opt/jdk
        with:
          project: 'ratchet'
          path: '.'
          format: 'HTML'
          out: 'target'
          args: >
            --format SARIF
            --failOnCVSS 7
            --nvdApiKey ${{ secrets.NVD_API_KEY }}
            --exclude /github/workspace/website
            --exclude /github/workspace/website/package.json
            --exclude /github/workspace/website/package-lock.json
            --disableNodeJS
            --disableNodeAudit
            --disableYarnAudit
            --disablePnpmAudit
            --disableRetireJs
            --disableOssIndex
            --suppression /github/workspace/owasp-suppressions.xml

      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: owasp-dependency-check-report
          path: |
            **/target/dependency-check-report.html
            **/target/dependency-check-report.sarif
          if-no-files-found: ignore

      - name: Upload SARIF to GitHub code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: target/dependency-check-report.sarif
          # Distinct category so these results don't overwrite CodeQL's in the
          # Security tab — each SARIF category is a separate analysis stream.
          category: owasp-dependency-check
        continue-on-error: true
