name: OWASP Dependency Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  owasp:
    runs-on: ubuntu-latest
    env:
      # Keep in step with the digest pinned on the scan steps below.
      SCANNER_IMAGE: owasp/dependency-check-action@sha256:0b37339a28122edfec1b21e03d169b55d301e3c91bf201801d301b2e567af222
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven repository
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: m2-

      - name: Build and stage resolved dependencies
        id: stage
        run: |
          mvn -B -ntp -DskipTests clean install
          mvn -B -ntp -DskipTests dependency:tree -DoutputType=json -DoutputFile=target/owasp-tree.json
          mvn -B -ntp -DskipTests help:effective-pom -Doutput=target/owasp-effective-pom.xml
          python3 infra/ci/stage_owasp.py --repository "$HOME/.m2/repository" --fetch-copied-poms
          mkdir -p target/owasp/reports/{runtime,tooling,tests}

      # The image bundles NVD data from when it was built. Without a cache, every run downloads
      # all changes since then, and one NVD error partway through fails the job. Restore after
      # the stage step, because its `mvn clean` removes target/. The key carries the image
      # digest, so a scanner bump never reuses a database written by another version.
      - name: Name the NVD data cache
        id: nvd-cache
        run: |
          scanner_digest="${SCANNER_IMAGE##*@sha256:}"
          echo "prefix=owasp-nvd-${scanner_digest:0:16}-" >> "$GITHUB_OUTPUT"
          echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore NVD data from an earlier run
        id: nvd-restore
        uses: actions/cache/restore@v6
        with:
          path: target/owasp/data
          key: ${{ steps.nvd-cache.outputs.prefix }}${{ steps.nvd-cache.outputs.day }}
          restore-keys: ${{ steps.nvd-cache.outputs.prefix }}

      - name: Refresh vulnerability data once for all reports
        id: nvd-update
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          set -euo pipefail
          scanner_data="$GITHUB_WORKSPACE/target/owasp/data"
          mkdir -p "$scanner_data"
          if [[ -z "$(ls -A "$scanner_data")" ]]; then
            # No cached copy: start from the data bundled in the image.
            scanner_container="$(docker create "$SCANNER_IMAGE")"
            trap 'docker rm -f "$scanner_container" >/dev/null 2>&1 || true' EXIT
            docker cp "$scanner_container:/usr/share/dependency-check/data/." "$scanner_data/"
            docker rm -f "$scanner_container"
            trap - EXIT
          fi
          update_args=(--data /data --updateonly --disableRetireJs)
          if [[ -n "${NVD_API_KEY:-}" ]]; then
            update_args+=(--nvdApiKey "$NVD_API_KEY")
          fi
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$scanner_data:/data" "$SCANNER_IMAGE" "${update_args[@]}"

      # Save only a database whose update finished, and before the scans, so a CVSS failure
      # still saves it. Pull request and merge queue runs read main's cache but do not add their
      # own, which keeps one entry a day.
      - name: Save the refreshed NVD data for later runs
        if: >-
          ${{ steps.nvd-update.outcome == 'success'
          && steps.nvd-restore.outputs.cache-hit != 'true'
          && contains(fromJSON('["push", "schedule", "workflow_dispatch"]'), github.event_name) }}
        uses: actions/cache/save@v6
        with:
          path: target/owasp/data
          key: ${{ steps.nvd-cache.outputs.prefix }}${{ steps.nvd-cache.outputs.day }}

      - name: Scan runtime dependencies
        # Keep each gate blocking, but collect the other reports after a CVSS failure.
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        # Pin the qualified scanner bytes; the upstream action otherwise pulls :latest.
        uses: docker://owasp/dependency-check-action@sha256:0b37339a28122edfec1b21e03d169b55d301e3c91bf201801d301b2e567af222
        env:
          # setup-java exports a host path that is unavailable inside the image.
          JAVA_HOME: /opt/jdk
        with:
          # Sibling POMs preserve coordinates without the flaky Central SHA-1 lookup.
          args: >-
            --project ratchet-runtime
            --scan /github/workspace/target/owasp/inputs/runtime
            --out /github/workspace/target/owasp/reports/runtime
            --data /github/workspace/target/owasp/data --noupdate
            --format HTML --format SARIF --format JSON
            --failOnCVSS 7
            --disableNodeJS --disableNodeAudit --disableYarnAudit --disablePnpmAudit
            --disableRetireJs --disableOssIndex --disableCentral
            --suppression /github/workspace/owasp-suppressions.xml

      - name: Scan tooling dependencies
        # Keep each gate blocking, but collect the other reports after a CVSS failure.
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        # Pin the qualified scanner bytes; the upstream action otherwise pulls :latest.
        uses: docker://owasp/dependency-check-action@sha256:0b37339a28122edfec1b21e03d169b55d301e3c91bf201801d301b2e567af222
        env:
          # setup-java exports a host path that is unavailable inside the image.
          JAVA_HOME: /opt/jdk
        with:
          # Sibling POMs preserve coordinates without the flaky Central SHA-1 lookup.
          args: >-
            --project ratchet-tooling
            --scan /github/workspace/target/owasp/inputs/tooling
            --out /github/workspace/target/owasp/reports/tooling
            --data /github/workspace/target/owasp/data --noupdate
            --format HTML --format SARIF --format JSON
            --failOnCVSS 7
            --disableNodeJS --disableNodeAudit --disableYarnAudit --disablePnpmAudit
            --disableRetireJs --disableOssIndex --disableCentral
            --suppression /github/workspace/owasp-suppressions.xml

      - name: Scan tests dependencies
        # Advisory: reports only; findings do not fail the job.
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        # Pin the qualified scanner bytes; the upstream action otherwise pulls :latest.
        uses: docker://owasp/dependency-check-action@sha256:0b37339a28122edfec1b21e03d169b55d301e3c91bf201801d301b2e567af222
        env:
          # setup-java exports a host path that is unavailable inside the image.
          JAVA_HOME: /opt/jdk
        with:
          # Sibling POMs preserve coordinates without the flaky Central SHA-1 lookup.
          args: >-
            --project ratchet-tests
            --scan /github/workspace/target/owasp/inputs/tests
            --out /github/workspace/target/owasp/reports/tests
            --data /github/workspace/target/owasp/data --noupdate
            --format HTML --format SARIF --format JSON
            --disableNodeJS --disableNodeAudit --disableYarnAudit --disablePnpmAudit
            --disableRetireJs --disableOssIndex --disableCentral
            --suppression /github/workspace/owasp-suppressions.xml

      - name: Verify report coverage against staged artifact hashes
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        run: python3 infra/ci/check_owasp_reports.py target/owasp

      - name: Upload Dependency-Check reports and input manifest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: owasp-dependency-check-report
          path: |
            target/owasp/manifest.json
            target/owasp/summary.json
            target/owasp/reports/
            **/target/owasp-tree.json
            target/owasp-effective-pom.xml
          if-no-files-found: error

      - name: Upload runtime SARIF
        if: ${{ !cancelled() && hashFiles('target/owasp/reports/runtime/dependency-check-report.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4.39.3
        with:
          sarif_file: target/owasp/reports/runtime/dependency-check-report.sarif
          category: owasp-dependency-check-runtime
        continue-on-error: true

      - name: Upload tooling SARIF
        if: ${{ !cancelled() && hashFiles('target/owasp/reports/tooling/dependency-check-report.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4.39.3
        with:
          sarif_file: target/owasp/reports/tooling/dependency-check-report.sarif
          category: owasp-dependency-check-tooling
        continue-on-error: true

      - name: Upload tests SARIF
        if: ${{ !cancelled() && hashFiles('target/owasp/reports/tests/dependency-check-report.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4.39.3
        with:
          sarif_file: target/owasp/reports/tests/dependency-check-report.sarif
          category: owasp-dependency-check-tests
        continue-on-error: true
