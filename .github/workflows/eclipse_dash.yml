name: Eclipse Dash License Check

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  dash-license-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Configure Eclipse Dash plugin repository
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
          <settings>
            <profiles>
              <profile>
                <id>eclipse-dash</id>
                <pluginRepositories>
                  <pluginRepository>
                    <id>dash-licenses</id>
                    <url>https://repo.eclipse.org/content/repositories/dash-licenses/</url>
                  </pluginRepository>
                </pluginRepositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>eclipse-dash</activeProfile>
            </activeProfiles>
          </settings>
          EOF

      - name: Eclipse Dash license check
        run: >
          mvn org.eclipse.dash:license-tool-plugin:1.1.0:license-check -Ddash.summary=target/dash-DEPENDENCIES
