version: 2

# Dependabot configuration for Ratchet.
#
# Three ecosystems are watched:
#   * maven           — every reactor pom + the four ratchet-tck submodules.
#                       Listed individually because each module declares at
#                       least some dependencies of its own.
#   * github-actions  — every reusable action pinned in .github/workflows/.
#   * npm             — the VitePress documentation site under /website.
#
# Two dependency families are *ignored* on purpose:
#   * org.jboss.shrinkwrap.resolver  — irregular release cadence; minor bumps
#                                      have historically broken the Arquillian
#                                      deployment harness in ratchet-testsuite.
#   * fish.payara.arquillian         — alpha-line connector for the
#                                      glassfish-managed profile (Jakarta EE
#                                      11). Updates land out of band with
#                                      Payara releases and require manual
#                                      re-validation against omnifish.

updates:
  - package-ecosystem: maven
    directories:
      - /
      - /ratchet-api
      - /ratchet-security-jakarta
      - /ratchet
      - /stores/ratchet-store-core
      - /stores/ratchet-store-mysql
      - /stores/ratchet-store-postgresql
      - /stores/ratchet-store-oracle
      - /stores/ratchet-store-sqlserver
      - /stores/ratchet-store-mongodb
      - /coordinators/ratchet-coordinator-common
      - /coordinators/ratchet-coordinator-postgresql
      - /coordinators/ratchet-coordinator-jms
      - /coordinators/ratchet-coordinator-infinispan
      - /coordinators/ratchet-coordinator-hazelcast
      - /testing/ratchet-tck
      - /testing/ratchet-tck/util
      - /testing/ratchet-tck/store
      - /testing/ratchet-tck/api
      - /testing/ratchet-tck/jakarta
      - /testing/ratchet-testsuite
      - /testing/ratchet-testsuite-jpms
      - /testing/ratchet-loadtest
      - /observability/ratchet-micrometer
      - /observability/ratchet-otel
      - /ratchet-bom
      - /testing/ratchet-coverage
      - /integrations/ratchet-quarkus
      - /integrations/ratchet-quarkus/core
      - /integrations/ratchet-quarkus/core-deployment
      - /integrations/ratchet-quarkus/runtime
      - /integrations/ratchet-quarkus/deployment
      - /integrations/ratchet-quarkus/mongodb
      - /integrations/ratchet-quarkus/mongodb-deployment
      - /integrations/ratchet-quarkus/integration-tests
      - /integrations/ratchet-spring-boot
      - /integrations/ratchet-spring-boot/ratchet-spring-boot-autoconfigure
      - /integrations/ratchet-spring-boot/ratchet-spring-boot-autoconfigure-jpa
      - /integrations/ratchet-spring-boot/ratchet-spring-boot-starter
      - /integrations/ratchet-spring-boot/ratchet-spring-boot-autoconfigure-mongodb
      - /integrations/ratchet-spring-boot/ratchet-spring-boot-starter-mongodb
      - /integrations/ratchet-spring-boot/ratchet-spring-boot-aot-spring7
      - /integrations/ratchet-spring-boot/integration-tests
      - /integrations/ratchet-spring-boot/integration-tests/compatibility
      - /integrations/ratchet-spring-boot/integration-tests/postgresql
      - /integrations/ratchet-spring-boot/integration-tests/mysql
      - /integrations/ratchet-spring-boot/integration-tests/oracle
      - /integrations/ratchet-spring-boot/integration-tests/sqlserver
      - /integrations/ratchet-spring-boot/integration-tests/mongodb
      - /integrations/ratchet-spring-boot/integration-tests/native-postgresql
    schedule:
      interval: daily
    open-pull-requests-limit: 20
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "org.jboss.shrinkwrap.resolver:*"
      - dependency-name: "fish.payara.arquillian:*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    groups:
      website-minor-and-patch:
        update-types:
          - minor
          - patch
