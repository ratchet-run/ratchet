# ============================================================================
# Demo app config. The ratchet-quarkus extension supplies all engine wiring and
# Ratchet's persistence unit; this module declares a datasource and its own app unit.
# ============================================================================

# --- Datasource: self-managed PostgreSQL via PostgresTestResource (standalone Testcontainers 2.0.5),
#     so this module runs headlessly in CI with no manually-managed database and avoids Quarkus Dev
#     Services' bundled Docker client on Docker Engine 29+. Ratchet ships its own schema (the
#     "ratchet" unit below uses generation=none), so PostgresTestResource seeds the container via
#     the canonical DDL that ships inside ratchet-store-postgresql's own jar — no local copy to drift
#     out of sync. ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.enabled=false

# --- MongoDB profile: the Mongo Quarkus flavor runs without Hibernate ORM or a datasource.
#     RatchetDatabaseTestResource supplies the connection string from a standalone MongoDB
#     Testcontainer, and the extension's MongoClientCustomizer forces UuidRepresentation.STANDARD
#     at client construction. ---
%mongo.quarkus.mongodb.database=ratchet_quarkus_tck
%mongo.quarkus.mongodb.devservices.enabled=false

# --- Ratchet requires READ COMMITTED. MySQL defaults to REPEATABLE READ (InnoDB gap locks stall
#     the claim query), so its IsolationCheck aborts startup without this. READ COMMITTED is already
#     the PostgreSQL and Oracle default, so setting it for every profile is a no-op there. ---
quarkus.datasource.jdbc.transaction-isolation-level=read-committed

# --- Ratchet's own persistence unit is supplied by the extension: named "ratchet", scoped to the
#     store entity package, bound to the default datasource, generation=none, JDBC timezone=UTC, and
#     with Ratchet's orm.xml attached only to that unit. Profile-specific low-level Hibernate
#     overrides below still target the extension-owned unit by name. ---
# --- Oracle only: its scheduler columns are plain TIMESTAMP(6), but Hibernate 6 maps Instant to
#     TIMESTAMP WITH TIME ZONE by default, so Oracle raises ORA-18716 ("not in any time zone") on
#     read. Force the plain-TIMESTAMP JDBC type. PostgreSQL uses TIMESTAMPTZ and MySQL DATETIME(6),
#     where the default mapping is correct, so this override is scoped to the %oracle profile. ---
%oracle.quarkus.hibernate-orm."ratchet".unsupported-properties."hibernate.type.preferred_instant_jdbc_type"=TIMESTAMP
# --- SQL Server needs the same override: its columns are DATETIME2(6) (no zone), but Hibernate 6
#     defaults Instant to datetimeoffset, so force plain TIMESTAMP under the %mssql profile. ---
%mssql.quarkus.hibernate-orm."ratchet".unsupported-properties."hibernate.type.preferred_instant_jdbc_type"=TIMESTAMP
# --- SQL Server stores UUIDs as canonical BINARY(16), matching the store's native SQL writes.
#     Hibernate's SQL Server dialect otherwise binds UUIDs through UNIQUEIDENTIFIER semantics, whose
#     mixed-endian byte order does not match those native writes and breaks FK checks from JPA-managed
#     execution-history inserts back to scheduler_job. ---
%mssql.quarkus.hibernate-orm."ratchet".unsupported-properties."hibernate.type.preferred_uuid_jdbc_type"=BINARY

# --- The application's OWN default persistence unit. The extension-owned named unit suppresses
#     Quarkus's auto-created default unit, so the app configures its own unit explicitly.
#     drop-and-create here proves the app manages its schema WITHOUT disturbing Ratchet's tables:
#     the ratchet unit leaves them alone (generation=none) and this unit only owns
#     run.ratchet.quarkus.it.app. ---
quarkus.hibernate-orm.packages=run.ratchet.quarkus.it.app
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.jdbc.timezone=UTC

# --- Use a random free HTTP port for @QuarkusTest so the suite never collides with a service
#     already bound to the default test port (8081), and parallel CI jobs can't clash. RestAssured
#     under @QuarkusTest auto-targets the actually-bound port. ---
quarkus.http.test-port=0

# --- Logging ---
quarkus.log.category."run.ratchet".level=INFO

# The circuit-breaker interceptor is declared via beans.xml <interceptors> (unused here).
ratchet.circuit-breaker.enabled=false
