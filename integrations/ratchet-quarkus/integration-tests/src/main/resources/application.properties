# ============================================================================
# Demo app config. The ratchet-quarkus extension supplies all engine wiring;
# this module declares a datasource and Ratchet's persistence unit.
# ============================================================================

# --- Datasource: self-managed PostgreSQL via PostgresTestResource (standalone Testcontainers 2.0.5),
#     so this module runs headlessly in CI with no manually-managed database and avoids Quarkus Dev
#     Services' bundled Docker client on Docker Engine 29+. Ratchet ships its own schema (the
#     "ratchet" unit below uses generation=none), so PostgresTestResource seeds the container via
#     the canonical DDL that ships inside ratchet-store-postgresql's own jar — no local copy to drift
#     out of sync. ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.enabled=false

# --- Ratchet's own persistence unit, isolated from the app's default unit. Scoped to the entity
#     package so the store's orm.xml is the converters' sole source (avoids the double-registration
#     that hits the default unit); generation=none because Ratchet ships its own schema. A named unit
#     must name its datasource explicitly (Quarkus does not fall back to the default), so it points at
#     the app's default datasource via the <default> token — one datasource, two units. ---
quarkus.hibernate-orm."ratchet".packages=run.ratchet.store.entity
quarkus.hibernate-orm."ratchet".datasource=<default>
quarkus.hibernate-orm."ratchet".database.generation=none

# --- The application's OWN default persistence unit. Declaring the named unit above suppresses
#     Quarkus's auto-created default unit, so the app configures it explicitly. drop-and-create here
#     proves the app manages its schema WITHOUT disturbing Ratchet's tables: the ratchet unit leaves
#     them alone (generation=none) and this unit only owns run.ratchet.quarkus.it.app.
#     mapping-files=no-file is REQUIRED: Quarkus auto-attaches Ratchet's META-INF/orm.xml to EVERY
#     unit, so without this the default unit would also pull in Ratchet's entities and drop-and-create
#     would wipe their tables. no-file keeps orm.xml on the ratchet unit alone. ---
quarkus.hibernate-orm.packages=run.ratchet.quarkus.it.app
quarkus.hibernate-orm.mapping-files=no-file
quarkus.hibernate-orm.database.generation=drop-and-create

# --- Use a random free HTTP port for @QuarkusTest so the suite never collides with a service
#     already bound to the default test port (8081), and parallel CI jobs can't clash. RestAssured
#     under @QuarkusTest auto-targets the actually-bound port. ---
quarkus.http.test-port=0

# --- Logging ---
quarkus.log.category."run.ratchet".level=INFO

# The circuit-breaker interceptor is declared via beans.xml <interceptors> (unused here).
ratchet.circuit-breaker.enabled=false
