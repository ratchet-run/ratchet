spring.main.banner-mode=off
spring.main.web-application-type=none
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
logging.level.root=WARN
logging.level.org.hibernate=WARN
ratchet.enabled=true
ratchet.schema.auto-migrate=true
ratchet.schema.migration-dialect=postgresql
ratchet.class-policy.allowed-packages=run.ratchet.spring.boot.it.nativepostgresql
ratchet.lifecycle.drain-timeout=PT30S
ratchet.recurring.poll-ms=100
ratchet.recurring.max-poll-ms=500
