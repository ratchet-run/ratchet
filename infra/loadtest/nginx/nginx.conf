worker_processes auto;
worker_rlimit_nofile 65535;

events {
  worker_connections 8192;
  multi_accept on;
}

http {
  access_log off;
  resolver 127.0.0.11 valid=1s ipv6=off;

  upstream ratchet_backend {
    zone ratchet_backend 64k;
    server ratchet-node:8080 resolve max_fails=1 fail_timeout=5s;
    keepalive 512;
    keepalive_requests 10000;
    keepalive_timeout 15s;
  }

  server {
    listen 8080;

    location = /api/jobs {
      proxy_pass http://ratchet_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_request_buffering on;
      proxy_connect_timeout 1s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
      proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504 non_idempotent;
      proxy_next_upstream_tries 5;
      proxy_next_upstream_timeout 10s;
    }

    location / {
      proxy_pass http://ratchet_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_connect_timeout 5s;
      proxy_read_timeout 120s;
      proxy_next_upstream error timeout http_502 http_503 http_504;
    }
  }
}
