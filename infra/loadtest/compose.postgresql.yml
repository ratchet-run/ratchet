services:
  ratchet-node:
    build:
      args:
        STORE: postgresql
    environment:
      DB_URL: "jdbc:postgresql://postgres:5432/ratchet"
      DB_USERNAME: "ratchet"
      DB_PASSWORD: "ratchet"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15
    shm_size: "${POSTGRES_SHM_SIZE:-1gb}"
    command:
      - "postgres"
      - "-c"
      - "max_connections=${POSTGRES_MAX_CONNECTIONS:-1000}"
    environment:
      POSTGRES_DB: ratchet
      POSTGRES_USER: ratchet
      POSTGRES_PASSWORD: ratchet
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../ratchet-store-postgresql/src/main/resources/ddl/postgresql-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ratchet -d ratchet"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
