name: ratchet-loadtest

services:
  ratchet-node:
    build:
      context: ../..
      dockerfile: infra/loadtest/Dockerfile
    environment:
      RATCHET_THREAD_POOL_SIZE_SINGLE: "${RATCHET_THREAD_POOL_SIZE_SINGLE:-32}"
      RATCHET_THREAD_POOL_SIZE_DEFAULT: "${RATCHET_THREAD_POOL_SIZE_DEFAULT:-16}"
      RATCHET_POLLER_MIN_DELAY_MS: "${RATCHET_POLLER_MIN_DELAY_MS:-250}"
      RATCHET_POLLER_MAX_DELAY_MS: "${RATCHET_POLLER_MAX_DELAY_MS:-2000}"
      RATCHET_POLLER_BATCH_SIZE: "${RATCHET_POLLER_BATCH_SIZE:-100}"
      RATCHET_NODE_HEARTBEAT_INTERVAL_SECONDS: "${RATCHET_NODE_HEARTBEAT_INTERVAL_SECONDS:-5}"
      RATCHET_NODE_ORPHAN_GRACE_SECONDS: "${RATCHET_NODE_ORPHAN_GRACE_SECONDS:-20}"
      RATCHET_JOB_ARCHIVE_ENABLED: "false"
      RATCHET_LOG_PURGE_ENABLED: "false"
      RATCHET_DLQ_PURGE_ENABLED: "false"
      DB_MIN_POOL_SIZE: "${DB_MIN_POOL_SIZE:-2}"
      DB_MAX_POOL_SIZE: "${DB_MAX_POOL_SIZE:-50}"
    expose:
      - "8080"
    labels:
      ratchet.loadtest: "true"
      prometheus.scrape: "true"
      prometheus.port: "8080"

  gateway:
    image: nginx:1.27-alpine
    depends_on:
      - ratchet-node
    ports:
      - "${RATCHET_GATEWAY_PORT:-8080}:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  prometheus:
    image: prom/prometheus:v2.55.1
    user: root
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-ratchet}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  k6:
    image: grafana/k6:0.54.0
    profiles:
      - k6
    depends_on:
      - gateway
    environment:
      TARGET_URL: "${TARGET_URL:-http://gateway:8080}"
      RUN_ID: "${RUN_ID:-}"
      MIN_ACCEPT_NODES: "${MIN_ACCEPT_NODES:-0}"
      NODE_PROBE_REQUESTS: "${NODE_PROBE_REQUESTS:-200}"
      CLUSTER_WAIT_SECONDS: "${CLUSTER_WAIT_SECONDS:-60}"
      LOAD_RATE: "${LOAD_RATE:-100}"
      LOAD_DURATION: "${LOAD_DURATION:-1m}"
      LOAD_PRE_ALLOCATED_VUS: "${LOAD_PRE_ALLOCATED_VUS:-50}"
      LOAD_MAX_VUS: "${LOAD_MAX_VUS:-500}"
      LOAD_HTTP_P95_MS: "${LOAD_HTTP_P95_MS:-1000}"
      LOAD_HTTP_ERROR_RATE: "${LOAD_HTTP_ERROR_RATE:-0.01}"
      LOAD_TEARDOWN_TIMEOUT: "${LOAD_TEARDOWN_TIMEOUT:-3m}"
      LOAD_MODE: "${LOAD_MODE:-spread}"
      LOAD_NO_CONNECTION_REUSE: "${LOAD_NO_CONNECTION_REUSE:-}"
      LOAD_ENQUEUE_RETRIES: "${LOAD_ENQUEUE_RETRIES:-3}"
      LOAD_ENQUEUE_RETRY_DELAY_MS: "${LOAD_ENQUEUE_RETRY_DELAY_MS:-100}"
      LOAD_ENQUEUE_RETRY_BACKOFF: "${LOAD_ENQUEUE_RETRY_BACKOFF:-2.0}"
      JOB_WORKLOAD: "${JOB_WORKLOAD:-noop}"
      JOB_SLEEP_MS: "${JOB_SLEEP_MS:-0}"
      JOB_SLEEP_JITTER_MS: "${JOB_SLEEP_JITTER_MS:-0}"
      JOB_SLEEP_SPIKE_RATE: "${JOB_SLEEP_SPIKE_RATE:-0.0}"
      JOB_SLEEP_SPIKE_MS: "${JOB_SLEEP_SPIKE_MS:-0}"
      JOB_FAILURE_RATE: "${JOB_FAILURE_RATE:-0.0}"
      JOB_PAYLOAD_BYTES: "${JOB_PAYLOAD_BYTES:-0}"
      JOB_MAX_RETRIES: "${JOB_MAX_RETRIES:-0}"
      JOB_PRIORITY: "${JOB_PRIORITY:-NORMAL}"
      JOB_TIMEOUT_SECONDS: "${JOB_TIMEOUT_SECONDS:-60}"
    volumes:
      - ./k6:/scripts:ro
    command: ["run", "/scripts/enqueue.js"]

  chaos-monkey:
    image: docker:27-cli
    profiles:
      - chaos
    environment:
      COMPOSE_PROJECT_NAME: "${COMPOSE_PROJECT_NAME:-}"
      CHAOS_TARGET_SERVICE: "${CHAOS_TARGET_SERVICE:-ratchet-node}"
      CHAOS_INTERVAL_SECONDS: "${CHAOS_INTERVAL_SECONDS:-30}"
      CHAOS_DOWN_SECONDS_MIN: "${CHAOS_DOWN_SECONDS_MIN:-5}"
      CHAOS_DOWN_SECONDS_MAX: "${CHAOS_DOWN_SECONDS_MAX:-20}"
      CHAOS_PROBABILITY: "${CHAOS_PROBABILITY:-1.0}"
      CHAOS_SEED: "${CHAOS_SEED:-}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./chaos/chaos-monkey.sh:/chaos-monkey.sh:ro
    command: ["/bin/sh", "/chaos-monkey.sh"]
