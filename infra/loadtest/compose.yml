name: ratchet-loadtest

services:
  ratchet-node:
    build:
      context: ../..
      dockerfile: infra/loadtest/Dockerfile
    environment:
      RATCHET_THREAD_POOL_SIZE_SINGLE: "${RATCHET_THREAD_POOL_SIZE_SINGLE:-32}"
      RATCHET_THREAD_POOL_SIZE_DEFAULT: "${RATCHET_THREAD_POOL_SIZE_DEFAULT:-16}"
      RATCHET_POLLER_MIN_DELAY_MS: "${RATCHET_POLLER_MIN_DELAY_MS:-250}"
      RATCHET_POLLER_MAX_DELAY_MS: "${RATCHET_POLLER_MAX_DELAY_MS:-2000}"
      RATCHET_POLLER_BATCH_SIZE: "${RATCHET_POLLER_BATCH_SIZE:-100}"
      RATCHET_NODE_HEARTBEAT_INTERVAL_SECONDS: "${RATCHET_NODE_HEARTBEAT_INTERVAL_SECONDS:-5}"
      RATCHET_NODE_ORPHAN_GRACE_SECONDS: "${RATCHET_NODE_ORPHAN_GRACE_SECONDS:-20}"
      RATCHET_JOB_ARCHIVE_ENABLED: "false"
      RATCHET_LOG_PURGE_ENABLED: "false"
      RATCHET_DLQ_PURGE_ENABLED: "false"
      DB_MIN_POOL_SIZE: "${DB_MIN_POOL_SIZE:-5}"
      DB_MAX_POOL_SIZE: "${DB_MAX_POOL_SIZE:-100}"
    expose:
      - "8080"
    labels:
      ratchet.loadtest: "true"
      prometheus.scrape: "true"
      prometheus.port: "8080"

  gateway:
    image: nginx:1.27-alpine
    depends_on:
      - ratchet-node
    ports:
      - "${RATCHET_GATEWAY_PORT:-8080}:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  prometheus:
    image: prom/prometheus:v2.55.1
    user: root
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-ratchet}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  chaos-monkey:
    image: docker:27-cli
    profiles:
      - chaos
    environment:
      COMPOSE_PROJECT_NAME: "${COMPOSE_PROJECT_NAME:-}"
      CHAOS_TARGET_SERVICE: "${CHAOS_TARGET_SERVICE:-ratchet-node}"
      CHAOS_INTERVAL_SECONDS: "${CHAOS_INTERVAL_SECONDS:-30}"
      CHAOS_DOWN_SECONDS_MIN: "${CHAOS_DOWN_SECONDS_MIN:-5}"
      CHAOS_DOWN_SECONDS_MAX: "${CHAOS_DOWN_SECONDS_MAX:-20}"
      CHAOS_PROBABILITY: "${CHAOS_PROBABILITY:-1.0}"
      CHAOS_SEED: "${CHAOS_SEED:-}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./chaos/chaos-monkey.sh:/chaos-monkey.sh:ro
    command: ["/bin/sh", "/chaos-monkey.sh"]
