services:
  ratchet-node:
    build:
      args:
        STORE: mysql
    environment:
      DB_URL: "${DB_URL:-jdbc:mysql://mysql:3306/ratchet?sessionVariables=transaction_isolation='READ-COMMITTED'&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true}"
      DB_USERNAME: "ratchet"
      DB_PASSWORD: "ratchet"
      DB_MIN_POOL_SIZE: "${DB_MIN_POOL_SIZE:-2}"
      DB_MAX_POOL_SIZE: "${DB_MAX_POOL_SIZE:-20}"
      RATCHET_POLLER_CLAIM_HEADROOM_FACTOR: "${RATCHET_POLLER_CLAIM_HEADROOM_FACTOR:-1}"
      RATCHET_RETRY_BUFFER_DRAIN_INTERVAL_MS: "${RATCHET_RETRY_BUFFER_DRAIN_INTERVAL_MS:-100}"
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    command: ["--transaction-isolation=READ-COMMITTED", "--max-connections=500"]
    environment:
      MYSQL_DATABASE: ratchet
      MYSQL_USER: ratchet
      MYSQL_PASSWORD: ratchet
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysqldata:/var/lib/mysql
      - ../../ratchet-store-mysql/src/main/resources/ddl/mysql-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./mysql-exporter/init.sql:/docker-entrypoint-initdb.d/02-mysql-exporter-user.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 30

  mysql-exporter:
    image: prom/mysqld-exporter:v0.17.2
    command: ["--config.my-cnf=/etc/mysqld-exporter/.my.cnf"]
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "9104"
    labels:
      ratchet.loadtest: "true"
      prometheus.scrape: "true"
      prometheus.port: "9104"
    volumes:
      - ./mysql-exporter/my.cnf:/etc/mysqld-exporter/.my.cnf:ro

volumes:
  mysqldata:
