# yaml-language-server: $schema=https://www.schemastore.org/qodana
version: "1.0"

# These exclusions are intentionally scoped to framework seams where Qodana cannot infer
# container-managed lifecycle or trusted internal SQL construction. Keep bug-prone inspections
# such as MalformedFormatString and IgnoreResultOfCall enabled globally.
exclude:
  - name: AutoCloseableResource
    paths:
      # EntityManager is injected and container-managed by Jakarta Persistence.
      - stores/ratchet-store-mysql/src/main/java
      - stores/ratchet-store-postgresql/src/main/java
      - testing/ratchet-testsuite/src/main/java/run/ratchet/testsuite/app
      - stores/ratchet-store-core/src/main/java/run/ratchet/store/converter
      # ExecutorService is used as a test resource
      - testing/ratchet-tck/util/src/main/java/run/ratchet/tck/util/ConcurrentTestRunner.java
      # Jsonb is held as an application-scoped serializer and closed in @PreDestroy.
      - ratchet/src/main/java/run/ratchet/ri/cdi/internal/JsonbPayloadSerializer.java
      # Coordinator callers fetch a held resource from the connection lifecycle and use it
      # inline; ownership stays with the lifecycle (or the framework, for EmbeddedCacheManager).
      - coordinators/ratchet-coordinator-jms/src/main/java/run/ratchet/coordinator/jms/JmsClusterCoordinator.java
      - coordinators/ratchet-coordinator-jms/src/main/java/run/ratchet/coordinator/jms/JmsConnectionLifecycle.java
      - coordinators/ratchet-coordinator-postgresql/src/main/java/run/ratchet/coordinator/postgresql/PostgresqlListenNotifyCoordinator.java
      - coordinators/ratchet-coordinator-infinispan/src/main/java/run/ratchet/coordinator/infinispan/InfinispanClusterCoordinator.java

  - name: DataFlowIssue
    paths:
      # CDI/Jakarta beans use protected no-arg constructors for proxying; injected constructor paths
      # initialize these final collaborators before application use.
      - ratchet/src/main/java/run/ratchet/ri/cdi
      - ratchet/src/main/java/run/ratchet/ri/core
      - ratchet/src/main/java/run/ratchet/ri/resilience
      - ratchet/src/main/java/run/ratchet/ri/security
      - stores/ratchet-store-mysql/src/main/java/run/ratchet/store/mysql/MysqlJobStoreImpl.java
      - stores/ratchet-store-postgresql/src/main/java/run/ratchet/store/postgresql/PostgresqlJobStoreImpl.java

  - name: SqlSourceToSinkFlow
    paths:
      # SQL text here is assembled from bundled migrations, fixed dialect templates, or enum-backed
      # query-builder fragments; runtime values are still bound through parameters.
      - stores/ratchet-store-core/src/main/java/run/ratchet/store/migration/SchemaMigrator.java
      - stores/ratchet-store-core/src/main/java/run/ratchet/store/util/IsolationCheck.java
      - stores/ratchet-store-mysql/src/main/java/run/ratchet/store/mysql/MysqlJobQueryOperations.java
      - stores/ratchet-store-postgresql/src/main/java/run/ratchet/store/postgresql/PostgresqlJobQueryOperations.java
      - stores/ratchet-store-postgresql/src/main/java/run/ratchet/store/postgresql/PostgresqlStoreContext.java
      - testing/ratchet-tck/store/src/main/java/run/ratchet/tck/store/JpaContainerFixture.java

  - name: BusyWait
    paths:
      # The TCK polls a public observable effect because chained child handles are not returned.
      - testing/ratchet-tck/api/src/main/java/run/ratchet/tck/api/AbstractSimpleWorkflowContract.java
      # Sleep inside the reconnect retry loop is exponential backoff with jitter, not polling.
      - coordinators/ratchet-coordinator-jms/src/main/java/run/ratchet/coordinator/jms/JmsConnectionLifecycle.java

  - name: OptionalUsedAsFieldOrParameterType
    paths:
      # Schema DSL parameter object; Optional makes absence explicit at the call boundary.
      - testing/ratchet-tck/store/src/main/java/run/ratchet/tck/store/schema/DialectTypeMapper.java
      # Coordinator cell suffix: every caller holds an Optional<String> cellId and threads it
      # straight through, so Optional at the boundary is intentional, not a leaked return type.
      - coordinators/ratchet-coordinator-common/src/main/java/run/ratchet/coordinator/common/CoordinatorCells.java
