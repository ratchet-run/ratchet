# No datasource URL is set, so in dev mode Quarkus Dev Services provisions a throwaway
# PostgreSQL container automatically. db-kind is stated so the store and driver line up.
quarkus.datasource.db-kind=postgresql

# Create Ratchet's schema on startup. This is a convenience for dev, CI, and embedded use;
# in production you may prefer to apply the shipped DDL out of band and leave this off.
ratchet.schema.auto-migrate=true
